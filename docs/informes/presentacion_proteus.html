<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PROTEUS 1.2 - Presentación Oficial de Elementos Visuales y Herramientas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #020617;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .slide-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #07123d 0%, #020617 100%);
    }
    .slide-frame {
      width: 1920px;
      height: 1080px;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      border: none;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      border-radius: 12px;
    }
    .nav-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      border-radius: 9999px;
      background: rgba(6, 18, 55, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.4);
    }
    .nav-btn {
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: rgba(56, 189, 248, 0.35);
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
      transition: all 0.2s;
    }
    .dot.active {
      background: #38bdf8;
      transform: scale(1.4);
      box-shadow: 0 0 8px #38bdf8;
    }
  </style>
</head>
<body>
  <div class="slide-viewport">
    <iframe id="slide-iframe" class="slide-frame" src="temp_slides/pres_slide_1.html"></iframe>
  </div>

  <div class="nav-bar">
    <button onclick="prevSlide()" class="nav-btn">◀ Anterior</button>
    <div id="dots-container" style="display: flex; gap: 8px; align-items: center; margin: 0 8px;">
      <div onclick="goToSlide(1)" id="dot-1" class="dot active"></div><div onclick="goToSlide(2)" id="dot-2" class="dot "></div><div onclick="goToSlide(3)" id="dot-3" class="dot "></div><div onclick="goToSlide(4)" id="dot-4" class="dot "></div><div onclick="goToSlide(5)" id="dot-5" class="dot "></div><div onclick="goToSlide(6)" id="dot-6" class="dot "></div><div onclick="goToSlide(7)" id="dot-7" class="dot "></div><div onclick="goToSlide(8)" id="dot-8" class="dot "></div>
    </div>
    <span id="slide-counter" style="font-family: monospace; font-size: 12px; font-weight: 800; color: #38bdf8; min-width: 45px; text-align: center;">1 / 8</span>
    <button onclick="nextSlide()" class="nav-btn">Siguiente ▶</button>
    <button onclick="toggleFullscreen()" class="nav-btn" style="background: rgba(52, 211, 153, 0.2); border-color: rgba(52, 211, 153, 0.4); color: #6ee7b7;">⛶ Pantalla Completa</button>
  </div>

  <script>
    let currentSlide = 1;
    const totalSlides = 8;

    function updateSlide() {
      document.getElementById('slide-iframe').src = `temp_slides/pres_slide_${currentSlide}.html`;
      document.getElementById('slide-counter').innerText = `${currentSlide} / ${totalSlides}`;
      for (let i = 1; i <= totalSlides; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (dot) dot.className = i === currentSlide ? 'dot active' : 'dot';
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        currentSlide++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 1) {
        currentSlide--;
        updateSlide();
      }
    }

    function goToSlide(n) {
      currentSlide = n;
      updateSlide();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });
  </script>
</body>
</html>
