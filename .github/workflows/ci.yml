name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisión de tipos (TypeScript)
        run: npm run typecheck
      - name: Lint (ESLint)
        run: npm run lint
      - name: Pruebas (Vitest)
        run: npm test
      - name: Build de producción
        run: npm run build
