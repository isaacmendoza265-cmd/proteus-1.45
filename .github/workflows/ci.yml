name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runners de GitHub, no el self-hosted de Guarne: el repo es público y un runner propio ejecutaría en
# nuestro servidor el código de cualquier PR externo.
jobs:
  verificar:
    name: Tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: proteus
          POSTGRES_PASSWORD: proteus
          POSTGRES_DB: proteus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U proteus" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://proteus:proteus@localhost:5432/proteus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Migraciones (aplicar y comprobar que el esquema no tiene cambios sin migrar)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Revisión de tipos (TypeScript)
        run: npm run typecheck
      - name: Lint (ESLint)
        run: npm run lint
      - name: Pruebas (Vitest, con PostgreSQL)
        run: npm test
      - name: Build de producción
        run: npm run build
