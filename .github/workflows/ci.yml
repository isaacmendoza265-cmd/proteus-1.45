name: CI - Build & Test Proteus

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Typecheck TypeScript
      run: npm run lint

    - name: Set up Python for GeoJSON Verification
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify GeoJSON & Relative Imports
      run: |
        python scripts/verify_imports.py
        python scripts/verify_geojson_integrity.py
